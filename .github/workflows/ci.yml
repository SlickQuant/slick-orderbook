name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  # ============================================================================
  # Linux Build & Test (GCC)
  # ============================================================================
  linux-gcc:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc-14]
        build_mode: [compiled, header-only]
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'

    - name: Cache vcpkg binary packages
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('.github/workflows/ci.yml', 'CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build ${{ matrix.compiler }} g++-14

    - name: Install vcpkg Dependencies
      env:
        VCPKG_BINARY_SOURCES: 'clear;files,${{ env.VCPKG_BINARY_CACHE }},readwrite'
      run: |
        mkdir -p "${VCPKG_BINARY_CACHE}"
        vcpkg install nlohmann-json openssl boost-beast jwt-cpp

    - name: Configure CMake (Compiled)
      if: matrix.build_mode == 'compiled'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DSLICK_ORDERBOOK_ENABLE_LTO=OFF \
          -DSLICK_ORDERBOOK_ENABLE_NATIVE_ARCH=OFF \
          -DSLICK_ORDERBOOK_BUILD_TESTS=ON \
          -DSLICK_ORDERBOOK_BUILD_EXAMPLES=ON \
          -DSLICK_ORDERBOOK_BUILD_COINBASE_EXAMPLE=ON \
          -DSLICK_ORDERBOOK_BUILD_BENCHMARKS=OFF

    - name: Configure CMake (Header-Only)
      if: matrix.build_mode == 'header-only'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DSLICK_ORDERBOOK_HEADER_ONLY=ON \
          -DSLICK_ORDERBOOK_BUILD_TESTS=ON \
          -DSLICK_ORDERBOOK_BUILD_EXAMPLES=ON \
          -DSLICK_ORDERBOOK_BUILD_COINBASE_EXAMPLE=ON \
          -DSLICK_ORDERBOOK_BUILD_BENCHMARKS=OFF

    - name: Build
      run: cmake --build build -j $(nproc)

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure -j $(nproc)

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux-${{ matrix.compiler }}-${{ matrix.build_mode }}-${{ matrix.build_type }}
        path: build/Testing/Temporary/LastTest.log

    # Package the tested build for release.yml (compiled Release leg only; no rebuild at release time)
    - name: Install
      if: matrix.build_mode == 'compiled' && matrix.build_type == 'Release'
      run: cmake --install build --prefix install --component slick-orderbook

    - name: Package
      if: matrix.build_mode == 'compiled' && matrix.build_type == 'Release' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: tar -czf slick-orderbook-linux-x64.tar.gz -C install .

    - name: Upload Package
      if: matrix.build_mode == 'compiled' && matrix.build_type == 'Release' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: package-linux-x64
        path: slick-orderbook-linux-x64.tar.gz
        if-no-files-found: error

  # ============================================================================
  # Linux Build & Test (Clang)
  # ============================================================================
  linux-clang:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        clang_version: [18]
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'

    - name: Cache vcpkg binary packages
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('.github/workflows/ci.yml', 'CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang-${{ matrix.clang_version }}

    - name: Install vcpkg Dependencies
      env:
        VCPKG_BINARY_SOURCES: 'clear;files,${{ env.VCPKG_BINARY_CACHE }},readwrite'
      run: |
        mkdir -p "${VCPKG_BINARY_CACHE}"
        vcpkg install nlohmann-json openssl boost-beast jwt-cpp

    - name: Clean build dir
      run: rm -rf build

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=clang-${{ matrix.clang_version }} \
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang_version }} \
          -DSLICK_ORDERBOOK_BUILD_TESTS=ON \
          -DSLICK_ORDERBOOK_ENABLE_LTO=OFF \
          -DSLICK_ORDERBOOK_BUILD_EXAMPLES=ON \
          -DSLICK_ORDERBOOK_BUILD_COINBASE_EXAMPLE=ON \
          -DSLICK_ORDERBOOK_BUILD_BENCHMARKS=OFF

    - name: Build
      run: cmake --build build -j $(nproc)

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure -j $(nproc)

  # ============================================================================
  # Windows Build & Test (MSVC 2022)
  # ============================================================================
  windows-msvc:
    runs-on: windows-2022
    strategy:
      matrix:
        build_mode: [compiled, header-only]
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Cache vcpkg binary packages
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('.github/workflows/ci.yml', 'CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install vcpkg dependencies
      env:
        VCPKG_BINARY_SOURCES: 'clear;files,${{ env.VCPKG_BINARY_CACHE }},readwrite'
      run: |
        New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE | Out-Null
        vcpkg install nlohmann-json:x64-windows openssl:x64-windows boost-beast:x64-windows jwt-cpp:x64-windows

    - name: Configure CMake (Compiled)
      if: matrix.build_mode == 'compiled'
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DSLICK_ORDERBOOK_ENABLE_LTO=OFF `
          -DSLICK_ORDERBOOK_BUILD_TESTS=ON `
          -DSLICK_ORDERBOOK_BUILD_EXAMPLES=ON `
          -DSLICK_ORDERBOOK_BUILD_COINBASE_EXAMPLE=ON `
          -DSLICK_ORDERBOOK_BUILD_BENCHMARKS=OFF

    - name: Configure CMake (Header-Only)
      if: matrix.build_mode == 'header-only'
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DSLICK_ORDERBOOK_HEADER_ONLY=ON `
          -DSLICK_ORDERBOOK_BUILD_TESTS=ON `
          -DSLICK_ORDERBOOK_BUILD_EXAMPLES=ON `
          -DSLICK_ORDERBOOK_BUILD_COINBASE_EXAMPLE=ON `
          -DSLICK_ORDERBOOK_BUILD_BENCHMARKS=OFF

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure -C ${{ matrix.build_type }} -j

    # Package the tested build for release.yml (compiled Release leg only; no rebuild at release time)
    - name: Install
      if: matrix.build_mode == 'compiled' && matrix.build_type == 'Release'
      run: cmake --install build --prefix install --config Release --component slick-orderbook

    - name: Package
      if: matrix.build_mode == 'compiled' && matrix.build_type == 'Release' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: Compress-Archive -Path install\* -DestinationPath slick-orderbook-windows-x64.zip

    - name: Upload Package
      if: matrix.build_mode == 'compiled' && matrix.build_type == 'Release' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: package-windows-x64
        path: slick-orderbook-windows-x64.zip
        if-no-files-found: error

  # ============================================================================
  # macOS Build & Test
  # ============================================================================
  macos:
    runs-on: macos-14
    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'

    - name: Cache vcpkg binary packages
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('.github/workflows/ci.yml', 'CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install System Dependencies
      run: |
        brew install cmake ninja

    - name: Install vcpkg Dependencies
      env:
        VCPKG_BINARY_SOURCES: 'clear;files,${{ env.VCPKG_BINARY_CACHE }},readwrite'
      run: |
        mkdir -p "${VCPKG_BINARY_CACHE}"
        vcpkg install nlohmann-json openssl boost-beast jwt-cpp

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DSLICK_ORDERBOOK_ENABLE_LTO=OFF \
          -DSLICK_ORDERBOOK_ENABLE_NATIVE_ARCH=OFF \
          -DSLICK_ORDERBOOK_BUILD_TESTS=ON \
          -DSLICK_ORDERBOOK_BUILD_EXAMPLES=ON \
          -DSLICK_ORDERBOOK_BUILD_COINBASE_EXAMPLE=ON \
          -DSLICK_ORDERBOOK_BUILD_BENCHMARKS=OFF

    - name: Build
      run: cmake --build build -j $(sysctl -n hw.ncpu)

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure -j $(sysctl -n hw.ncpu)

    # Package the tested build for release.yml (Release leg only; no rebuild at release time)
    - name: Install
      if: matrix.build_type == 'Release'
      run: cmake --install build --prefix install --component slick-orderbook

    - name: Package
      if: matrix.build_type == 'Release' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: tar -czf slick-orderbook-macos-arm64.tar.gz -C install .

    - name: Upload Package
      if: matrix.build_type == 'Release' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: package-macos-arm64
        path: slick-orderbook-macos-arm64.tar.gz
        if-no-files-found: error

  # ============================================================================
  # Sanitizer Builds
  # ============================================================================
  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizer: [address, thread, undefined]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcc-14 g++-14

    - name: Configure CMake
      run: |
        SANITIZER_FLAGS=""
        if [ "${{ matrix.sanitizer }}" = "address" ]; then
          SANITIZER_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
        elif [ "${{ matrix.sanitizer }}" = "thread" ]; then
          SANITIZER_FLAGS="-fsanitize=thread"
        elif [ "${{ matrix.sanitizer }}" = "undefined" ]; then
          SANITIZER_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer"
        fi

        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_CXX_FLAGS="$SANITIZER_FLAGS" \
          -DSLICK_ORDERBOOK_BUILD_TESTS=ON \
          -DSLICK_ORDERBOOK_BUILD_EXAMPLES=OFF \
          -DSLICK_ORDERBOOK_BUILD_BENCHMARKS=OFF

    - name: Build
      run: cmake --build build -j $(nproc)

    - name: Test
      working-directory: ${{ github.workspace }}/build
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: ctest --output-on-failure -j $(nproc)

  # ============================================================================
  # Code Coverage
  # ============================================================================
  coverage:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcc-14 g++-14 lcov

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage -fprofile-update=atomic" \
          -DSLICK_ORDERBOOK_BUILD_TESTS=ON \
          -DSLICK_ORDERBOOK_BUILD_EXAMPLES=OFF \
          -DSLICK_ORDERBOOK_BUILD_BENCHMARKS=OFF

    - name: Build
      run: cmake --build build -j $(nproc)

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure -j $(nproc)

    - name: Generate Coverage Report
      run: |
        lcov --gcov-tool gcov-14 --capture --directory build --output-file coverage.info --ignore-errors mismatch,inconsistent
        lcov --gcov-tool gcov-14 --remove coverage.info '/usr/*' '*/tests/*' '*/build/*' --output-file coverage.info --ignore-errors unused
        lcov --list coverage.info

    # Reporting only: a Codecov outage must not fail CI (and so block releases via ci-success).
    # Coverage build/test failures above still fail this job.
    - name: Upload Coverage to Codecov
      continue-on-error: true
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.info
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  # ============================================================================
  # Static Analysis
  # ============================================================================
  static-analysis:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang-18 clang-tidy-18

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_COMPILER=clang++-18 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DSLICK_ORDERBOOK_BUILD_TESTS=ON \
          -DSLICK_ORDERBOOK_BUILD_EXAMPLES=OFF \
          -DSLICK_ORDERBOOK_BUILD_BENCHMARKS=OFF

    - name: Run clang-tidy
      run: |
        find include -name "*.hpp" -print0 | xargs -0 -n1 clang-tidy-18 -p build --warnings-as-errors='*' || true

  # ============================================================================
  # Status Check (Required for PRs)
  # ============================================================================
  ci-success:
    runs-on: ubuntu-latest
    needs: [linux-gcc, linux-clang, windows-msvc, macos, sanitizers, coverage, static-analysis]
    if: always()

    steps:
    # Gate on every job in `needs` (no hand-maintained list that can drift from it)
    - name: Check CI Status
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
        # Fail closed: any jq error leaves FAILED != 0
        FAILED=$(echo "$NEEDS" | jq '[.[] | select(.result != "success")] | length')
        if [ "$FAILED" != "0" ]; then
          echo "CI failed"
          exit 1
        fi
        echo "All CI checks passed"
