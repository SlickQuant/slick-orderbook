name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags (v1.0.0, v1.2.3, etc.)
  workflow_dispatch:  # Run on a tag ref to retry a release

# Nothing is rebuilt here: the release publishes the packages that CI (ci.yml) built and tested
# for the tagged commit. CI packages every push to main, so tag a commit that has been pushed to main.

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write  # Required for creating releases
      actions: read    # Required for finding the CI run and downloading its artifacts

    steps:
    - uses: actions/checkout@v4

    - name: Get Version
      id: get_version
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

        # Packages carry the project version from CMakeLists.txt; refuse a tag that disagrees
        PROJECT_VERSION=$(sed -nE 's/^project\(slick-orderbook VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
        if [ "$VERSION" != "$PROJECT_VERSION" ]; then
          echo "::error::Tag '$GITHUB_REF_NAME' does not match project version '$PROJECT_VERSION' in CMakeLists.txt"
          exit 1
        fi

    - name: Find CI Run
      id: ci_run
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # CI for this commit may still be running (tag pushed right after the merge), so wait for it
        for attempt in $(seq 1 100); do
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
                  --commit "$GITHUB_SHA" --limit 1 --json databaseId,status,conclusion \
                  --jq '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion)"' || true)
          read -r RUN_ID STATUS CONCLUSION <<< "$RUN"

          if [ -z "$RUN_ID" ]; then
            echo "No CI run on main for $GITHUB_SHA yet (attempt $attempt)"
          elif [ "$STATUS" != "completed" ]; then
            echo "CI run $RUN_ID is $STATUS (attempt $attempt)"
          elif [ "$CONCLUSION" = "success" ]; then
            echo "Using packages from CI run $RUN_ID"
            echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "::error::CI run $RUN_ID for $GITHUB_SHA concluded '$CONCLUSION'; fix or re-run CI, then re-run this workflow"
            exit 1
          fi
          sleep 60
        done

        echo "::error::No successful CI run on main for $GITHUB_SHA. Tag a commit that has been pushed to main."
        exit 1

    - name: Download Packages
      uses: actions/download-artifact@v4
      with:
        pattern: package-*
        path: packages
        merge-multiple: true
        run-id: ${{ steps.ci_run.outputs.run_id }}
        github-token: ${{ github.token }}

    - name: Name Packages
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        mkdir -p dist
        for platform in linux-x64.tar.gz windows-x64.zip macos-arm64.tar.gz; do
          mv "packages/slick-orderbook-$platform" "dist/slick-orderbook-$VERSION-$platform"
        done

    - name: Create Documentation Archive
      run: |
        tar -czf dist/slick-orderbook-${{ steps.get_version.outputs.version }}-docs.tar.gz \
          README.md ARCHITECTURE.md CHANGELOG.md LICENSE \
          docs/ examples/ benchmarks/PROFILING_GUIDE.md
        ls -l dist

    - name: Extract Changelog
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"

        # Extract the section for this version from CHANGELOG.md
        awk -v version="$VERSION" '
          /^## \[/ {
            if (found) exit;
            if ($0 ~ "\\[" version "\\]") {
              found=1;
              next;
            }
          }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > RELEASE_NOTES.md

        # If extraction failed or file is empty, use a default message
        if [ ! -s RELEASE_NOTES.md ]; then
          echo "Release version $VERSION" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "See [CHANGELOG.md](https://github.com/SlickQuant/slick-orderbook/blob/main/CHANGELOG.md) for details." >> RELEASE_NOTES.md
        fi

        # Add header
        sed -i '1i# Release Notes\n' RELEASE_NOTES.md

        echo "Release notes:"
        cat RELEASE_NOTES.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        body_path: RELEASE_NOTES.md
        files: dist/*
        fail_on_unmatched_files: true
        draft: false
        prerelease: false
